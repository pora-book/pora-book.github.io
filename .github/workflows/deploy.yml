name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so newly uploaded lecture recordings (pulled from YouTube by
  # scripts/build-lectures-manifest.mjs) go live without a commit.
  schedule:
    - cron: '0 6 * * *'

# Permissions needed for the deploy-pages action to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json withholds esbuild/sharp install scripts (allowScripts),
      # so make sure their native binaries are present before building.
      - name: Ensure native binaries
        run: npm rebuild esbuild sharp

      # Refresh the AA174A lecture list from its YouTube playlist. Never fails the
      # build: on a network/scrape error the committed JSON is used as-is.
      - name: Fetch latest lecture recordings
        run: npm run manifest:lectures

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
